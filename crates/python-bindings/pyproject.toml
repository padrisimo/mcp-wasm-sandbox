[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "mcp-wasm-sandbox"
version = "0.1.0"
description = "Model Context Protocol server that runs untrusted WebAssembly inside a Wasmtime sandbox."
license = { text = "MIT" }
authors = [
    { name = "Adrian Fernandez Chamizo espinete@duck.org" },
]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
]

[tool.maturin]
module-name = "mcp_wasm_sandbox"
features = ["extension-module"]
