name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 8 * * 0"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The Python bindings are built as an extension module, so they cannot be
      # linked into a test binary on Linux. They are tested in the python job.
      - name: Test
        run: cargo test --workspace --exclude mcp-wasm-sandbox

      - name: Benchmarks compile
        run: cargo bench --workspace --exclude mcp-wasm-sandbox --no-run

      - name: Audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit the dependency tree
        run: cargo audit

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: "3.12"

      - uses: taiki-e/install-action@v2
        with:
          tool: maturin

      # Without the extension-module feature the crate links against libpython,
      # so the interpreter-backed tests can run.
      - name: Test the bindings
        env:
          PYO3_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: cargo test -p mcp-wasm-sandbox --no-default-features

      - name: Test the GIL release
        env:
          PYO3_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: cargo test -p mcp-wasm-sandbox --no-default-features -- --ignored

      - name: Build the wheel
        working-directory: crates/python-bindings
        run: maturin build --release --out dist

      - name: Import the wheel
        working-directory: crates/python-bindings
        run: |
          pip install dist/*.whl
          python -c "import mcp_wasm_sandbox; print(mcp_wasm_sandbox.WasmSandbox(1024, 1000))"

      - name: Build the server
        run: cargo build -p mcp-server

      - name: End-to-end tests
        run: |
          pip install pytest
          pytest tests -q

  benchmarks:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run the benchmarks
        run: cargo bench -p sandbox-core

      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: criterion-report
          path: target/criterion
          if-no-files-found: ignore
