[workspace]
resolver = "2"
members = [
    "crates/sandbox-core",
    "crates/mcp-server",
    "crates/python-bindings",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Adrian Fernandez Chamizo espinete@duck.org"]
repository = "https://github.com/padrisimo/mcp-wasm-sandbox"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasmtime = { version = "25.0" }
thiserror = "1.0"
pyo3 = { version = "0.30" }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
base64 = "0.22"
wat = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
