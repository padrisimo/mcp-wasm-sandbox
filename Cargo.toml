[workspace]
resolver = "2"
members = [
    "crates/sandbox-core",
    "crates/mcp-server",
    "crates/python-bindings",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Adrian Fernandez Chamizo espinete@duck.org"]
repository = "https://github.com/padrisimo/mcp-wasm-sandbox"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasmtime = { version = "25.0", features = ["wasi"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
